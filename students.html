<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CPR Syndicate — Students</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{--purple:#6D3BF5;--purple-2:#7C3AED;--purple-dim:#EEEAFE;--purple-dim-2:#F4F1FF;
    --bg:#F5F5FA;--card:#FFF;--ink:#1B1B2E;--muted:#8A8A99;--border:#E6E6F0;--green:#16A34A;--amber:#D97706;--blue:#2563EB;--red:#EF4444;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:var(--bg);color:var(--ink);}
  .topbar{background:var(--card);border-bottom:1px solid var(--border);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:30;}
  body.embed .brand{display:none;}
  .brand{display:flex;align-items:center;gap:10px;}
  .logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--purple-2),var(--purple));border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:700;}
  .brand h1{font-size:16px;font-weight:800;letter-spacing:-.02em;}
  .right{display:flex;align-items:center;gap:10px;}
  .search{border:1px solid var(--border);border-radius:9px;padding:8px 12px;font:inherit;font-size:13px;width:280px;max-width:48vw;}
  .btn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:7px 11px;font:inherit;font-size:12px;font-weight:700;color:var(--ink);cursor:pointer;}
  .btn:hover{border-color:var(--purple);color:var(--purple);}

  .wrap{padding:16px 22px 60px;}
  .scoreboard{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
  @media(max-width:760px){.scoreboard{grid-template-columns:1fr 1fr;}}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:13px 15px;}
  .stat .l{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
  .stat .v{font-size:23px;font-weight:800;letter-spacing:-.02em;margin-top:5px;}
  .stat .v.purple{color:var(--purple);}

  .filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
  .chip{border:1px solid var(--border);background:#fff;border-radius:100px;padding:6px 13px;font:inherit;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;}
  .chip.active{background:var(--purple-dim);color:var(--purple);border-color:transparent;}

  .tablewrap{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px;}
  th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--bg);font-weight:800;position:sticky;top:0;}
  tbody tr:hover{background:var(--purple-dim-2);}
  td.name{font-weight:700;}
  td a{color:var(--purple);text-decoration:none;}
  .tag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:100px;}
  .t-future{background:#E8F8EE;color:var(--green);} .t-previous{background:var(--bg);color:var(--muted);}
  .s-booking{background:#EFF6FF;color:var(--blue);} .s-import{background:var(--purple-dim);color:var(--purple);}

  .pager{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;font-size:12.5px;color:var(--muted);}
  .pager .btns{display:flex;gap:6px;}
  .empty,.loading{padding:40px;text-align:center;color:var(--muted);font-weight:600;}

  .gate{max-width:340px;margin:80px auto;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:26px;text-align:center;}
  .gate h2{font-size:17px;margin-bottom:6px;} .gate p{font-size:12.5px;color:var(--muted);margin-bottom:16px;}
  .gate input{width:100%;border:1px solid var(--border);border-radius:10px;padding:11px;font-size:15px;text-align:center;letter-spacing:.1em;margin-bottom:12px;}
  .gate button{width:100%;background:var(--purple);color:#fff;border:none;border-radius:10px;padding:11px;font:inherit;font-size:14px;font-weight:800;cursor:pointer;}
  .err{color:var(--red);font-size:12px;font-weight:600;margin-top:8px;}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="logo-icon">+</div><h1>Students</h1></div>
  <div class="right">
    <input class="search" id="search" placeholder="Search name, email, cert, location…">
    <button class="btn" id="export">⬇ CSV</button>
    <button class="btn" id="refresh">↻</button>
  </div>
</header>
<div class="wrap"><div id="content"><div class="loading">—</div></div></div>

<script>
const API = 'https://cpr-syndicate-renewals.vercel.app';
let ALL = [], counts = {}, filter = 'all', q = '', page = 0;
const PER = 100;
function pass(){ return sessionStorage.getItem('board_pass') || ''; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function load(){
  document.getElementById('content').innerHTML='<div class="loading">Loading students…</div>';
  try{
    const r=await fetch(`${API}/api/students?pass=${encodeURIComponent(pass())}`);
    if(r.status===401){ sessionStorage.removeItem('board_pass'); return gate('Wrong passcode'); }
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json(); ALL=d.students||[]; counts=d.counts||{};
    render();
  }catch(e){ document.getElementById('content').innerHTML='<div class="empty">Error: '+esc(e.message)+'</div>'; }
}
function filtered(){
  let list=ALL;
  if(filter==='future') list=list.filter(s=>s.status==='future');
  else if(filter==='previous') list=list.filter(s=>s.status==='previous');
  else if(filter==='booking') list=list.filter(s=>s.source==='booking');
  else if(filter==='import') list=list.filter(s=>s.source==='import');
  if(q){ const t=q.toLowerCase(); list=list.filter(s=>(s.name+' '+s.email+' '+s.cert+' '+s.location).toLowerCase().includes(t)); }
  return list;
}
function render(){
  const list=filtered(); const pages=Math.max(1,Math.ceil(list.length/PER)); if(page>=pages)page=0;
  const rows=list.slice(page*PER,page*PER+PER);
  const c=document.getElementById('content');
  c.innerHTML =
    `<div class="scoreboard">
      <div class="stat"><div class="l">Total students</div><div class="v purple">${(counts.total||0).toLocaleString()}</div></div>
      <div class="stat"><div class="l">Booking app</div><div class="v">${(counts.booking||0).toLocaleString()}</div></div>
      <div class="stat"><div class="l">CSV imports</div><div class="v">${(counts.import||0).toLocaleString()}</div></div>
      <div class="stat"><div class="l">Upcoming (future)</div><div class="v">${(counts.future||0).toLocaleString()}</div></div>
    </div>
    <div class="filters">
      ${[['all','All'],['future','Future'],['previous','Previous'],['booking','Booking app'],['import','CSV imports']].map(([k,l])=>`<button class="chip${filter===k?' active':''}" data-f="${k}">${l}</button>`).join('')}
      <span style="margin-left:auto;font-size:12px;color:var(--muted);font-weight:600">${list.length.toLocaleString()} shown</span>
    </div>
    <div class="tablewrap">
      <table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Certification</th><th>Location</th><th>Class date</th><th>Status</th><th>Source</th></tr></thead>
      <tbody>${rows.length?rows.map(rowHtml).join(''):'<tr><td colspan="8" class="empty">No students match.</td></tr>'}</tbody></table>
      <div class="pager"><span>Page ${page+1} of ${pages} · ${rows.length} rows</span>
        <div class="btns"><button class="btn" id="prev" ${page===0?'disabled':''}>← Prev</button><button class="btn" id="next" ${page>=pages-1?'disabled':''}>Next →</button></div>
      </div>
    </div>`;
  c.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filter=b.dataset.f;page=0;render();});
  const pv=document.getElementById('prev'), nx=document.getElementById('next');
  if(pv)pv.onclick=()=>{if(page>0){page--;render();}}; if(nx)nx.onclick=()=>{page++;render();};
}
function rowHtml(s){
  return `<tr><td class="name">${esc(s.name)}</td>`
    + `<td><a href="mailto:${esc(s.email)}">${esc(s.email)}</a></td>`
    + `<td>${s.phone?`<a href="tel:${esc(s.phone)}">${esc(s.phone)}</a>`:'—'}</td>`
    + `<td>${esc(s.cert)||'—'}</td><td>${esc(s.location)||'—'}</td><td>${s.classDate?esc(s.classDate):'—'}</td>`
    + `<td><span class="tag t-${s.status}">${s.status}</span></td>`
    + `<td><span class="tag s-${s.source}">${s.source==='booking'?'Booking':'Import'}</span></td></tr>`;
}
function exportCsv(){
  const list=filtered(); const head=['name','email','phone','cert','location','class_date','status','source'];
  const csv=[head.join(',')].concat(list.map(s=>[s.name,s.email,s.phone,s.cert,s.location,s.classDate||'',s.status,s.source].map(v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(','))).join('\n');
  const a=document.createElement('a'); a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv); a.download='cpr-syndicate-students.csv'; a.click();
}
function gate(err){
  document.getElementById('content').innerHTML=`<div class="gate"><h2>🔒 Students</h2><p>Enter the team passcode.</p><input id="pc" type="password" placeholder="passcode" autofocus><button id="go">Unlock</button>${err?`<div class="err">${err}</div>`:''}</div>`;
  const submit=()=>{const v=document.getElementById('pc').value.trim();if(v){sessionStorage.setItem('board_pass',v);load();}};
  document.getElementById('go').onclick=submit; document.getElementById('pc').addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
}
document.getElementById('search').addEventListener('input',e=>{q=e.target.value;page=0;render();});
document.getElementById('refresh').addEventListener('click',load);
document.getElementById('export').addEventListener('click',exportCsv);
if(new URLSearchParams(location.search).get('embed')) document.body.classList.add('embed');
pass()?load():gate('');
</script>
</body>
</html>
